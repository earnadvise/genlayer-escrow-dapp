<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="6" />
  
  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Shield Base Contour -->
  <path d="M256 96 L376 144 V264 C376 344 256 400 256 400 C256 400 136 344 136 264 V144 Z" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Scale of Justice / AI Neural Node Core -->
  <!-- Central Pillar -->
  <line x1="256" y1="160" x2="256" y2="320" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="150" r="14" fill="#14b8a6" filter="url(#glow)" />

  <!-- Balance Beam -->
  <line x1="180" y1="190" x2="332" y2="190" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Left Scale Pan (Buyer) -->
  <line x1="180" y1="190" x2="160" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="180" y1="190" x2="200" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M150 240 Q180 260 210 240 Z" fill="#6366f1" opacity="0.9" />

  <!-- Right Scale Pan (Seller) -->
  <line x1="332" y1="190" x2="312" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <line x1="332" y1="190" x2="352" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <path d="M302 240 Q332 260 362 240 Z" fill="#14b8a6" opacity="0.9" />

  <!-- Central AI Equivalence Orb -->
  <circle cx="256" cy="270" r="28" fill="#0b0f19" stroke="url(#primaryGrad)" stroke-width="6" />
  <circle cx="256" cy="270" r="14" fill="#10b981" filter="url(#glow)" />
  
  <!-- Neural Sparkles -->
  <polygon points="256,60 262,75 277,75 265,84 269,99 256,90 243,99 247,84 235,75 250,75" fill="#2dd4bf" />
</svg>
