<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bannerBg)" />
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="url(#bannerGlow)" />
  <circle cx="1000" cy="450" r="220" fill="#14b8a6" opacity="0.15" filter="url(#bannerGlow)" />

  <!-- Grid overlay -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="2" />
    <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2dd4bf" letter-spacing="1">GENLAYER INTELLIGENT DAPP</text>

    <!-- Title -->
    <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">ArbitratedEscrow</text>

    <!-- Subtitle -->
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Decentralized Escrow Registry with AI-Validator Arbitration
    </text>
    <text x="0" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" fill="#64748b">
      Non-Deterministic Web Crawl • Race-Condition Protected • Equivalence Principle Consensus
    </text>

    <!-- Contract Badge -->
    <rect x="0" y="240" width="460" height="42" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="267" font-family="'JetBrains Mono', monospace" font-size="14" fill="#cbd5e1">
      Contract: 0x27765327341E605F84493563A03Bf33d71ae0928
    </text>
  </g>
</svg>
